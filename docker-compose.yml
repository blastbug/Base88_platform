# BASE88 開発用インフラ（PostgreSQL + メール検証用 Mailpit）
# 使い方: docker compose up -d
#   - PostgreSQL : localhost:5432  (db=base88, user=base88, pass=secret)
#   - Mailpit UI : http://localhost:8025  (SMTP: localhost:1025)
# ※ Docker を使わない場合は、backend/.env の DB_CONNECTION=sqlite で即時に動作します。

services:
  db:
    image: postgres:16-alpine
    container_name: base88_db
    environment:
      POSTGRES_DB: base88
      POSTGRES_USER: base88
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - base88_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U base88"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: base88_mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped

volumes:
  base88_db_data:
